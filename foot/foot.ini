# ===========================================================================
#  FOOT TERMINAL CONFIGURATION — Minimal & Fast (Obsidian Theme)
# ===========================================================================

term=foot
font=JetBrains Mono:size=11, monospace:size=11
font-bold=JetBrains Mono:size=11:weight=bold, monospace:size=11:weight=bold
font-italic=JetBrains Mono:size=11:slant=italic, monospace:size=11:slant=italic
pad=12x12 center=yes
dpi-aware=yes

[environment]
# Set standard editor
EDITOR=nvim

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=yes
beam-thickness=1.5
color=0b0e14 7dd3fc

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
foreground=e8edf5
background=0b0e14

## Normal colors
regular0=19212d
regular1=f08080
regular2=8be28b
regular3=e8c77b
regular4=7dd3fc
regular5=b4a7ff
regular6=8ba4ff
regular7=e8edf5

## Bright colors
bright0=475569
bright1=f08080
bright2=8be28b
bright3=e8c77b
bright4=38bdf8
bright5=b4a7ff
bright6=8ba4ff
bright7=ffffff

## Selection & UI highlights
selection-foreground=e8edf5
selection-background=1e293b
urls=7dd3fc
scrollback-indicator=7dd3fc 19212d

[url]
launch=xdg-open ${url}
protocols=http, https, ftp, ftps, file, gemini, gopher, irc, ircs

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s

# ===========================================================================
#  FOOT TERMINAL CONFIGURATION — Ultra-Fast & Latency-Optimized
# ===========================================================================

font=monospace:size=10
pad=8x8 center
dpi-aware=no
resize-delay-ms=100
workers=12
box-drawings-uses-font-glyphs=no
gamma-correct-blending=no

[environment]
EDITOR=nvim

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
foreground=14b9b5
background=0e091d
cursor=0e091d ff7f41

## Normal colors
regular0=000000
regular1=c8e967
regular2=e20342
regular3=7cd699
regular4=be3f50
regular5=9147a8
regular6=ff7f41
regular7=a60234

## Bright colors
bright0=c53253
bright1=ce4f48
bright2=f93d3b
bright3=fd3e6a
bright4=04c5f0
bright5=6c032c
bright6=ffbe74
bright7=11aeb3

## Selection & UI highlights
selection-foreground=0e091d
selection-background=14b9b5
urls=04c5f0
scrollback-indicator=14b9b5 342946

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s

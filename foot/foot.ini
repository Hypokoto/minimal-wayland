# ===========================================================================
#  FOOT TERMINAL CONFIGURATION — Minimal Cybercore
# ===========================================================================

font=monospace:size=10
pad=8x8 center
dpi-aware=no
resize-delay-ms=100
workers=12
box-drawings-uses-font-glyphs=no
gamma-correct-blending=no

[environment]
EDITOR=nvim

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=yes
beam-thickness=2.0

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
foreground=E2E2E2
background=050505
cursor=00E5FF 050505

## Normal colors
regular0=050505
regular1=FF003C
regular2=00FF66
regular3=FFEA00
regular4=00E5FF
regular5=FF007F
regular6=00E5FF
regular7=E2E2E2

## Bright colors
bright0=1A1A1A
bright1=FF3366
bright2=33FF88
bright3=FFFF33
bright4=33EEFF
bright5=FF3399
bright6=33EEFF
bright7=FFFFFF

## Selection & UI highlights
selection-foreground=050505
selection-background=00E5FF
urls=FF007F
scrollback-indicator=00E5FF 1A1A1A

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s

# ===========================================================================
#  FOOT TERMINAL CONFIGURATION — Ultra-Fast & Latency-Optimized (Synthwave)
# ===========================================================================

font=monospace:size=10
pad=8x8 center
dpi-aware=no
resize-delay-ms=100
workers=12
box-drawings-uses-font-glyphs=no
gamma-correct-blending=no

[environment]
# Set standard editor
EDITOR=nvim

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
foreground=ede6f5
background=0e091d
cursor=0e091d ff7f41

## Normal colors
regular0=161124
regular1=be3f50
regular2=72f1b8
regular3=ffe66d
regular4=04c5f0
regular5=c792ea
regular6=14b9b5
regular7=ede6f5

## Bright colors
bright0=493961
bright1=fd3e6a
bright2=88ffc8
bright3=ffea79
bright4=36d9ff
bright5=e0a3ff
bright6=34e0dc
bright7=ffffff

## Selection & UI highlights
selection-foreground=ffffff
selection-background=342946
urls=04c5f0
scrollback-indicator=14b9b5 342946

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s

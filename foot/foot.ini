# ===========================================================================
#  FOOT TERMINAL CONFIGURATION — Ultra-Fast & Latency-Optimized
# ===========================================================================

font=monospace:size=10
pad=8x8 center
dpi-aware=no
resize-delay-ms=100
workers=12
box-drawings-uses-font-glyphs=no
gamma-correct-blending=no

[environment]
EDITOR=nvim

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
foreground=14B9B5
background=0e091d
cursor=ff7f41 0e091d

## Normal colors
regular0=000000
regular1=c8e967
regular2=E20342
regular3=7cd699
regular4=BE3F50
regular5=9147a8
regular6=FF7F41
regular7=A60234

## Bright colors
bright0=c53253
bright1=CE4F48
bright2=f93d3b
bright3=FD3E6A
bright4=04C5F0
bright5=6C032C
bright6=ffbe74
bright7=11AEB3

## Selection & UI highlights
selection-foreground=0e091d
selection-background=14B9B5
urls=04C5F0
scrollback-indicator=14B9B5 c53253

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s
